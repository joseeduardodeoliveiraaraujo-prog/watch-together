<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="referrer" content="strict-origin-when-cross-origin" />
<title>Watch Together Player</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #player { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="player"></div>
<script>
(function () {
  'use strict';

  var player = null;
  var ready = false;
  var pending = [];
  var STATUS_INTERVAL_MS = 500;

  function send(msg) {
    var data = JSON.stringify(msg);
    if (window.ReactNativeWebView && window.ReactNativeWebView.postMessage) {
      window.ReactNativeWebView.postMessage(data);
    } else if (window.console) {
      console.log('[wt]', data);
    }
  }

  function safeNumber(fn) {
    try {
      var value = fn();
      return typeof value === 'number' && isFinite(value) ? value : 0;
    } catch (e) {
      return 0;
    }
  }

  function currentTime() { return safeNumber(function () { return player.getCurrentTime(); }); }

  // Legendas: getOption/setOption('captions', ...) não são documentados pelo YouTube, mas são o
  // único jeito de listar e trocar a legenda pela IFrame API. Tudo protegido por try/catch.
  var captionTracks = [];
  var captionLanguages = [];

  function trackId(track) {
    return String(track.vss_id || ((track.kind === 'asr' ? 'a.' : '') + (track.languageCode || '')));
  }

  function readOption(name) {
    try { return player.getOption('captions', name); } catch (e) { return null; }
  }

  function captionsInfo() {
    var list = readOption('tracklist');
    captionTracks = list && list.length ? list : [];
    var langs = readOption('translationLanguages');
    captionLanguages = langs && langs.length ? langs : [];
    var current = readOption('track');

    var tracks = [];
    var active = null;
    for (var i = 0; i < captionTracks.length; i++) {
      var t = captionTracks[i];
      var id = trackId(t);
      if (!id) continue;
      tracks.push({
        id: id,
        label: String(t.displayName || t.languageName || t.languageCode || id),
        auto: t.kind === 'asr'
      });
      if (current && current.languageCode && active === null) {
        var sameVss = t.vss_id && current.vss_id && t.vss_id === current.vss_id;
        var sameLang = t.languageCode === current.languageCode && (t.kind || '') === (current.kind || '');
        if (sameVss || sameLang) {
          var tl = current.translationLanguage;
          active = { id: id, translateTo: tl && tl.languageCode ? String(tl.languageCode) : null };
        }
      }
    }

    var translations = [];
    for (var j = 0; j < captionLanguages.length; j++) {
      var l = captionLanguages[j];
      if (!l || !l.languageCode) continue;
      translations.push({ code: String(l.languageCode), label: String(l.languageName || l.languageCode) });
    }
    return { type: 'captions', tracks: tracks, translations: translations, active: active };
  }

  function sendCaptions() { send(captionsInfo()); }

  function setCaption(selection) {
    if (!selection || typeof selection.id !== 'string') {
      player.setOption('captions', 'track', {});
    } else {
      var track = null;
      for (var i = 0; i < captionTracks.length; i++) {
        if (trackId(captionTracks[i]) === selection.id) track = captionTracks[i];
      }
      if (!track) { sendCaptions(); return; }
      // Cópia da faixa; a tradução automática é a mesma faixa com translationLanguage.
      var chosen = {};
      for (var key in track) {
        if (Object.prototype.hasOwnProperty.call(track, key) && key !== 'translationLanguage') {
          chosen[key] = track[key];
        }
      }
      if (typeof selection.translateTo === 'string') {
        for (var j = 0; j < captionLanguages.length; j++) {
          if (captionLanguages[j].languageCode === selection.translateTo) {
            chosen.translationLanguage = captionLanguages[j];
          }
        }
      }
      var modules = [];
      try { modules = player.getOptions() || []; } catch (e) { modules = []; }
      if (modules.indexOf('captions') < 0) player.loadModule('captions');
      player.setOption('captions', 'track', chosen);
    }
    // O YouTube aplica a troca de forma assíncrona: confirma o estado logo depois.
    setTimeout(sendCaptions, 500);
  }

  function execute(cmd) {
    switch (cmd.type) {
      case 'load':
        var opts = { videoId: cmd.videoId, startSeconds: cmd.startSeconds || 0 };
        if (cmd.autoplay) { player.loadVideoById(opts); } else { player.cueVideoById(opts); }
        break;
      case 'play': player.playVideo(); break;
      case 'pause': player.pauseVideo(); break;
      case 'seek': player.seekTo(cmd.seconds, true); break;
      case 'mute': if (cmd.muted) { player.mute(); } else { player.unMute(); } break;
      case 'getCaptions': sendCaptions(); break;
      case 'setCaption': setCaption(cmd.selection); break;
      default: send({ type: 'log', message: 'unknown command: ' + cmd.type });
    }
  }

  window.__wt = {
    handle: function (cmd) {
      if (!cmd || typeof cmd.type !== 'string') return;
      if (!ready) {
        // Antes do player existir, só o último "load" e comandos posteriores importam.
        if (cmd.type === 'load') pending = [];
        pending.push(cmd);
        return;
      }
      try { execute(cmd); } catch (e) { send({ type: 'log', message: 'command failed: ' + e }); }
    }
  };

  window.onerror = function (message) {
    send({ type: 'log', message: 'page error: ' + message });
  };

  window.onYouTubeIframeAPIReady = function () {
    var playerVars = {
      controls: 0,
      disablekb: 1,
      playsinline: 1,
      rel: 0,
      fs: 0,
      iv_load_policy: 3,
      enablejsapi: 1
    };
    if (/^https?:/.test(window.location.origin)) {
      playerVars.origin = window.location.origin;
    }

    player = new YT.Player('player', {
      width: '100%',
      height: '100%',
      playerVars: playerVars,
      events: {
        onReady: function () {
          ready = true;
          send({ type: 'ready' });
          var queued = pending;
          pending = [];
          for (var i = 0; i < queued.length; i++) window.__wt.handle(queued[i]);
          setInterval(function () {
            send({
              type: 'status',
              state: safeNumber(function () { return player.getPlayerState(); }),
              currentTime: currentTime(),
              duration: safeNumber(function () { return player.getDuration(); }),
              muted: (function () { try { return player.isMuted(); } catch (e) { return false; } })(),
              at: Date.now()
            });
          }, STATUS_INTERVAL_MS);
        },
        onStateChange: function (event) {
          send({ type: 'stateChange', state: event.data, currentTime: currentTime(), at: Date.now() });
        },
        // Módulos (como o de legendas) carregados para o vídeo atual: a lista pode ter mudado.
        onApiChange: function () { sendCaptions(); },
        onError: function (event) {
          send({ type: 'error', code: event.data });
        }
      }
    });
  };

  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function () { send({ type: 'apiLoadError' }); };
  document.head.appendChild(tag);
})();
</script>
</body>
</html>
